# Caption-group SAT alignment: fixed 1710 optimizer steps, not 3 image epochs.
# Physical batch16 x accumulation4 = 109440 image exposures; queue0, no augmentation.
[experiment]
name = "skyscript_sat_adapter_textlora_multipos_1710step_seed11"
seed = 11
output_dir = "outputs/skyscript_sat_adapter_textlora_multipos_1710step_seed11"

[model]
dinov3_repo = "external/dinov3"
backbone_domain = "sat"
backbone_weights = "assets/checkpoints/dinov3_vitl16_pretrain_sat493m-eadcf0ff.pth"
dinotxt_weights = "assets/checkpoints/dinov3_vitl16_dinotxt_vision_head_and_text_encoder-a442d8f5.pth"
bpe_vocab = "assets/checkpoints/bpe_simple_vocab_16e6.txt.gz"
image_size = 224
text_last_k = 0
train_vision_head = false
train_text_projection = false
train_logit_scale = false
image_adapter_bottleneck = 256
vision_head_drop_path = 0.0
text_lora_rank = 8
text_lora_alpha = 16.0
text_lora_dropout = 0.0
text_lora_include_projection = true

[data]
train_manifest = "assets/data/manifests/skyscript_caption_groups_v1/train_grouped.jsonl"
val_manifest = "assets/data/manifests/skyscript_images23_val_raw_unique4055_seed23_global77.jsonl"
validation_batch_size = 16
validation_forward_batch_size = 64
validation_num_workers = 4
validation_prefetch_factor = 4
num_workers = 0
train_augmentation = false
shuffle_train = true
caption_sampling = "caption_group"
images_per_caption = 2

[train]
device = "cuda"
precision = "bf16"
batch_size = 16
gradient_accumulation = 4
max_steps = 1710
warmup_steps = 171
learning_rate = 0.0001
weight_decay = 0.01
image_adapter_learning_rate = 0.0001
image_adapter_weight_decay = 0.01
text_projection_learning_rate = 0.0001
text_backbone_learning_rate = 0.0001
text_projection_weight_decay = 0.01
text_backbone_weight_decay = 0.01

max_grad_norm = 1.0
queue_size = 0
contrastive_objective = "multi_positive"
validation_every = 200
validation_at_start = true
log_every = 10
checkpoint_every = 200
checkpoint_policy = "rolling"
