[experiment]
name = "m4_web_b_visionhead_lr5e5_100step_seed11"
seed = 11
output_dir = "outputs/m4_web_b_visionhead_lr5e5_100step_seed11"

[model]
dinov3_repo = "external/dinov3"
backbone_domain = "web"
backbone_weights = "assets/checkpoints/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth"
dinotxt_weights = "assets/checkpoints/dinov3_vitl16_dinotxt_vision_head_and_text_encoder-a442d8f5.pth"
bpe_vocab = "assets/checkpoints/bpe_simple_vocab_16e6.txt.gz"
image_size = 224
text_last_k = 0
train_vision_head = true
train_text_projection = false
train_logit_scale = false

[data]
train_manifest = "assets/data/manifests/chatearthnet_35_train_10k_seed11_no_nodata_global77.jsonl"
val_manifest = "assets/data/manifests/chatearthnet_35_val_no_nodata_global77.jsonl"
validation_batch_size = 16
validation_forward_batch_size = 64
validation_num_workers = 4
validation_prefetch_factor = 4
num_workers = 0
train_augmentation = true
shuffle_train = true
fixed_monitor_manifest = "assets/data/manifests/chatearthnet_35_train_10k_seed11_no_nodata_global77_fixed16.jsonl"
fixed_monitor_batch_size = 16

[train]
device = "cuda"
precision = "bf16"
batch_size = 16
gradient_accumulation = 4
max_steps = 5000
warmup_steps = 250
learning_rate = 0.00005
weight_decay = 0.01
max_grad_norm = 1.0
queue_size = 4096
fixed_monitor_every = 10
validation_every = 50
validation_at_start = true
log_every = 1
checkpoint_every = 50
