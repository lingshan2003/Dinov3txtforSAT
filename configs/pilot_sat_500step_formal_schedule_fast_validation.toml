[experiment]
name = "m3_sat_global77_formalschedule_500step_pilot_fastval_seed11"
seed = 11
output_dir = "outputs/m3_sat_global77_formalschedule_500step_pilot_fastval_seed11"

[model]
dinov3_repo = "external/dinov3"
backbone_domain = "sat"
backbone_weights = "assets/checkpoints/dinov3_vitl16_pretrain_sat493m-eadcf0ff.pth"
dinotxt_weights = "assets/checkpoints/dinov3_vitl16_dinotxt_vision_head_and_text_encoder-a442d8f5.pth"
bpe_vocab = "assets/checkpoints/bpe_simple_vocab_16e6.txt.gz"
image_size = 224
text_last_k = 4
train_vision_head = true
train_text_projection = true
train_logit_scale = true

[data]
train_manifest = "assets/data/manifests/chatearthnet_35_train_10k_seed11_no_nodata_global77.jsonl"
val_manifest = "assets/data/manifests/chatearthnet_35_val_no_nodata_global77.jsonl"
# This is the metric definition: keep it at 16 to remain comparable with the Web pilot.
validation_batch_size = 16
# Each GPU forward covers four unchanged loss groups. 64 is a multiple of 16.
validation_forward_batch_size = 64
# Train workers stay at zero for exact resume. Validation has no augmentation or shuffle.
validation_num_workers = 4
validation_prefetch_factor = 4
num_workers = 0
train_augmentation = true
shuffle_train = true
fixed_monitor_manifest = "assets/data/manifests/chatearthnet_35_train_10k_seed11_no_nodata_global77_fixed16.jsonl"
fixed_monitor_batch_size = 16

[train]
device = "cuda"
precision = "bf16"
batch_size = 16
gradient_accumulation = 4
# Keep the exact formal schedule; the script caps execution at optimizer step 500.
max_steps = 5000
warmup_steps = 250
learning_rate = 0.00005
weight_decay = 0.01
max_grad_norm = 1.0
queue_size = 4096
fixed_monitor_every = 50
validation_every = 50
validation_at_start = true
log_every = 1
checkpoint_every = 250
